# Phase 2b block 3 (PLAN.md §6): gamma placement. GENERATED by a one-off script; the
# levels below are the frozen record, edit them here directly.
#
# Every (variant, optimizer) at its middle size and alpha (Adam family: TS 1, modular 2,
# MNIST 4; SGD family: TS 1, modular 2, MNIST d3 2, MNIST d8 4), one seed, 1e5 steps.
# Six candidate gammas each; block 3 keeps 4 per (variant, optimizer).
# AdamW and the SGD family: gamma = lambda / lr_eff, rounded to the 1-3-10 grid, for the
# per-step decay rate lambda in {0, 1e-5, 3e-5, 1e-4, 3e-4, 1e-3} (lr_eff = lr / (1 -
# momentum)). Under the LU mechanism grok time ~ ln(w0/wc) / lambda, so these target
# ~3e3 to ~1e5 steps. Adam+L2 is rescaled by Adam's normalization and does not follow
# that law; it gets one-decade levels {0, 1e-6, ..., 1e-2}.
# Teacher-student also runs AdamW at alpha 2 (where Phase 1 grokked) at the two smallest
# nonzero gammas to 3e5 steps, to decide between raising gamma and extending its
# horizon. Its test set is 1000 samples.
#
# Learning rates (confirmed 2026-10-22 from the Phase 2a scan; PLAN.md §9):
#   variant              adamw / adam_l2   sgd     sgd_momentum   SGD-family alpha levels
#   teacher_student      3e-4              0.1     0.1            {0.5, 1, 2}
#   modular (all ops)    1e-3              1.0     0.3            {1, 2, 4}
#   mnist d3             1e-3              0.03    0.01           {1, 2, 4}
#   mnist d8             1e-3              alpha 2: 0.1, alpha 4: 1e-4 (both)   {2, 4} (alpha 1 never trains)

record: &record {log_every: 50, summary_every: 500, keyframe_every: 10000}
ts: &ts
  task: {name: teacher_student, params: {n_train: 100, n_test: 1000, theta: 0.01}}
  model: {depth: 3, width: 100, activation: tanh, init_scale: 1.0}
  optim: {name: adamw, lr: 3.0e-4, weight_decay: 0.1}
  loss: mse
  steps: 100000
  seed: 0
  record: *record
mod_add: &mod_add
  task: {name: modular, params: {op: x+y, p: 97, train_frac: 0.5}}
  model: {depth: 3, width: 512, activation: relu, init_scale: 2.0}
  optim: {name: adamw, lr: 1.0e-3, weight_decay: 1.0}
  loss: ce
  steps: 100000
  seed: 0
  record: *record
mod_mul: &mod_mul
  <<: *mod_add
  task: {name: modular, params: {op: x*y, p: 97, train_frac: 0.5}}
mod_quad: &mod_quad
  <<: *mod_add
  task: {name: modular, params: {op: x^2+xy+y^2, p: 97, train_frac: 0.5}}
mnist_d3: &mnist_d3
  task: {name: mnist, params: {n_train: 1000}}
  model: {depth: 3, width: 200, activation: relu, init_scale: 4.0}
  optim: {name: adamw, lr: 1.0e-3, weight_decay: 0.03}
  loss: mse
  steps: 100000
  seed: 0
  batch_size: 200
  record: *record
mnist_d8: &mnist_d8
  <<: *mnist_d3
  model: {depth: 8, width: 400, activation: relu, init_scale: 4.0}

blocks:
  # ---- teacher_student ----
  - base: *ts
    variants: [{model.init_scale: 1.0, optim: {name: adamw, lr: 3.0e-4}}]
    product: {optim.weight_decay: [0.0, 3.0e-2, 1.0e-1, 3.0e-1, 1.0, 3.0]}  # lambda = 0.0, 1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3
  - base: *ts
    variants: [{model.init_scale: 1.0, optim: {name: adam_l2, lr: 3.0e-4}}]
    product: {optim.weight_decay: [0.0, 1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2]}
  - base: *ts
    variants: [{model.init_scale: 1.0, optim: {name: sgd_momentum, momentum: 0.9, lr: 1.0e-1}}]
    product: {optim.weight_decay: [0.0, 1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3]}  # lambda = 0.0, 1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3
  - base: *ts
    variants: [{model.init_scale: 1.0, optim: {name: sgd, lr: 1.0e-1}}]
    product: {optim.weight_decay: [0.0, 1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3, 1.0e-2]}  # lambda = 0.0, 1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3
  # ---- modular x+y ----
  - base: *mod_add
    variants: [{model.init_scale: 2.0, optim: {name: adamw, lr: 1.0e-3}}]
    product: {optim.weight_decay: [0.0, 1.0e-2, 3.0e-2, 1.0e-1, 3.0e-1, 1.0]}  # lambda = 0.0, 1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3
  - base: *mod_add
    variants: [{model.init_scale: 2.0, optim: {name: adam_l2, lr: 1.0e-3}}]
    product: {optim.weight_decay: [0.0, 1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2]}
  - base: *mod_add
    variants: [{model.init_scale: 2.0, optim: {name: sgd_momentum, momentum: 0.9, lr: 3.0e-1}}]
    product: {optim.weight_decay: [0.0, 3.0e-6, 1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4]}  # lambda = 0.0, 1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3
  - base: *mod_add
    variants: [{model.init_scale: 2.0, optim: {name: sgd, lr: 1.0}}]
    product: {optim.weight_decay: [0.0, 1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3]}  # lambda = 0.0, 1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3
  # ---- modular x*y ----
  - base: *mod_mul
    variants: [{model.init_scale: 2.0, optim: {name: adamw, lr: 1.0e-3}}]
    product: {optim.weight_decay: [0.0, 1.0e-2, 3.0e-2, 1.0e-1, 3.0e-1, 1.0]}  # lambda = 0.0, 1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3
  - base: *mod_mul
    variants: [{model.init_scale: 2.0, optim: {name: adam_l2, lr: 1.0e-3}}]
    product: {optim.weight_decay: [0.0, 1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2]}
  - base: *mod_mul
    variants: [{model.init_scale: 2.0, optim: {name: sgd_momentum, momentum: 0.9, lr: 3.0e-1}}]
    product: {optim.weight_decay: [0.0, 3.0e-6, 1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4]}  # lambda = 0.0, 1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3
  - base: *mod_mul
    variants: [{model.init_scale: 2.0, optim: {name: sgd, lr: 1.0}}]
    product: {optim.weight_decay: [0.0, 1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3]}  # lambda = 0.0, 1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3
  # ---- modular x^2+xy+y^2 ----
  - base: *mod_quad
    variants: [{model.init_scale: 2.0, optim: {name: adamw, lr: 1.0e-3}}]
    product: {optim.weight_decay: [0.0, 1.0e-2, 3.0e-2, 1.0e-1, 3.0e-1, 1.0]}  # lambda = 0.0, 1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3
  - base: *mod_quad
    variants: [{model.init_scale: 2.0, optim: {name: adam_l2, lr: 1.0e-3}}]
    product: {optim.weight_decay: [0.0, 1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2]}
  - base: *mod_quad
    variants: [{model.init_scale: 2.0, optim: {name: sgd_momentum, momentum: 0.9, lr: 3.0e-1}}]
    product: {optim.weight_decay: [0.0, 3.0e-6, 1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4]}  # lambda = 0.0, 1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3
  - base: *mod_quad
    variants: [{model.init_scale: 2.0, optim: {name: sgd, lr: 1.0}}]
    product: {optim.weight_decay: [0.0, 1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3]}  # lambda = 0.0, 1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3
  # ---- mnist d3 ----
  - base: *mnist_d3
    variants: [{model.init_scale: 4.0, optim: {name: adamw, lr: 1.0e-3}}]
    product: {optim.weight_decay: [0.0, 1.0e-2, 3.0e-2, 1.0e-1, 3.0e-1, 1.0]}  # lambda = 0.0, 1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3
  - base: *mnist_d3
    variants: [{model.init_scale: 4.0, optim: {name: adam_l2, lr: 1.0e-3}}]
    product: {optim.weight_decay: [0.0, 1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2]}
  - base: *mnist_d3
    variants: [{model.init_scale: 2.0, optim: {name: sgd_momentum, momentum: 0.9, lr: 1.0e-2}}]
    product: {optim.weight_decay: [0.0, 1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3, 1.0e-2]}  # lambda = 0.0, 1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3
  - base: *mnist_d3
    variants: [{model.init_scale: 2.0, optim: {name: sgd, lr: 3.0e-2}}]
    product: {optim.weight_decay: [0.0, 3.0e-4, 1.0e-3, 3.0e-3, 1.0e-2, 3.0e-2]}  # lambda = 0.0, 1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3
  # ---- mnist d8 ----
  - base: *mnist_d8
    variants: [{model.init_scale: 4.0, optim: {name: adamw, lr: 1.0e-3}}]
    product: {optim.weight_decay: [0.0, 1.0e-2, 3.0e-2, 1.0e-1, 3.0e-1, 1.0]}  # lambda = 0.0, 1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3
  - base: *mnist_d8
    variants: [{model.init_scale: 4.0, optim: {name: adam_l2, lr: 1.0e-3}}]
    product: {optim.weight_decay: [0.0, 1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2]}
  - base: *mnist_d8
    variants: [{model.init_scale: 4.0, optim: {name: sgd_momentum, momentum: 0.9, lr: 1.0e-4}}]
    product: {optim.weight_decay: [0.0, 1.0e-2, 3.0e-2, 1.0e-1, 3.0e-1, 1.0]}  # lambda = 0.0, 1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3
  - base: *mnist_d8
    variants: [{model.init_scale: 4.0, optim: {name: sgd, lr: 1.0e-4}}]
    product: {optim.weight_decay: [0.0, 1.0e-1, 3.0e-1, 1.0, 3.0, 10.0]}  # lambda = 0.0, 1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3
  # ---- teacher_student, AdamW, long horizon ----
  - base: *ts
    variants: [{steps: 300000, model.init_scale: 2.0}]  # the grokking alpha, as in Phase 1
    product: {optim.weight_decay: [3.0e-2, 1.0e-1]}

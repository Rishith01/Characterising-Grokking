# Phase 2 block 2 (PLAN.md §6): learning-rate scan per (application variant, optimizer).
# One seed, 5k steps: enough to see divergence or progress, not to grok.
#
# Every variant is at its middle training size (modular frac 0.5, MNIST n 1000,
# teacher-student N 100). Selection: tfs/sweep/lr_select.py.
#   Adam family (adamw, adam_l2): at the middle alpha. The published lr (3e-4 for
#     teacher-student, 1e-3 otherwise) is kept unless the scan shows it unstable.
#   SGD family (sgd, sgd_momentum): at all three alpha levels, over 13 half-decade lrs.
#     SGD's stable lr shrinks fast with alpha (at alpha = 8 on MNIST it diverged at every
#     lr), so the scan also shows which alpha levels the SGD family can use at all.
# Weight decay here only has to be plausible (it barely affects stability); block 3
# places the real gamma levels per (application, optimizer).
adam_lrs: &adam_lrs [1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3]
sgd_lrs: &sgd_lrs [1.0, 0.3, 0.1, 3.0e-2, 1.0e-2, 3.0e-3, 1.0e-3, 3.0e-4, 1.0e-4, 3.0e-5, 1.0e-5, 3.0e-6, 1.0e-6]
sgd_family: &sgd_family
  - {optim: {name: sgd, weight_decay: 1.0e-3}}
  - {optim: {name: sgd_momentum, weight_decay: 1.0e-3, momentum: 0.9}}
record: &record {log_every: 50, summary_every: 500, keyframe_every: 5000}

teacher_student: &ts
  task: {name: teacher_student, params: {n_train: 100, n_test: 100, theta: 0.01}}
  model: {depth: 3, width: 100, activation: tanh, init_scale: 1.0}
  optim: {name: adamw, lr: 3.0e-4, weight_decay: 0.1}
  loss: mse
  steps: 5000
  seed: 0
  record: *record
mod_add: &mod_add
  task: {name: modular, params: {op: x+y, p: 97, train_frac: 0.5}}
  model: {depth: 3, width: 512, activation: relu, init_scale: 2.0}
  optim: {name: adamw, lr: 1.0e-3, weight_decay: 1.0}
  loss: ce
  steps: 5000
  seed: 0
  record: *record
mod_mul: &mod_mul
  <<: *mod_add
  task: {name: modular, params: {op: x*y, p: 97, train_frac: 0.5}}
mod_quad: &mod_quad
  <<: *mod_add
  task: {name: modular, params: {op: x^2+xy+y^2, p: 97, train_frac: 0.5}}
mnist_d3: &mnist_d3
  task: {name: mnist, params: {n_train: 1000}}
  model: {depth: 3, width: 200, activation: relu, init_scale: 4.0}
  optim: {name: adamw, lr: 1.0e-3, weight_decay: 0.03}
  loss: mse
  steps: 5000
  seed: 0
  batch_size: 200
  record: *record
mnist_d8: &mnist_d8
  <<: *mnist_d3
  model: {depth: 8, width: 400, activation: relu, init_scale: 4.0}

blocks:
  # ---- Adam family, middle alpha ----
  - base: *ts
    variants: [{optim: {name: adamw, weight_decay: 0.1}}, {optim: {name: adam_l2, weight_decay: 1.0e-4}}]
    product: {optim.lr: *adam_lrs}
  - base: *mod_add
    variants: [{optim: {name: adamw, weight_decay: 1.0}}, {optim: {name: adam_l2, weight_decay: 1.0e-4}}]
    product: {optim.lr: *adam_lrs}
  - base: *mod_mul
    variants: [{optim: {name: adamw, weight_decay: 1.0}}, {optim: {name: adam_l2, weight_decay: 1.0e-4}}]
    product: {optim.lr: *adam_lrs}
  - base: *mod_quad
    variants: [{optim: {name: adamw, weight_decay: 1.0}}, {optim: {name: adam_l2, weight_decay: 1.0e-4}}]
    product: {optim.lr: *adam_lrs}
  - base: *mnist_d3
    variants: [{optim: {name: adamw, weight_decay: 0.03}}, {optim: {name: adam_l2, weight_decay: 1.0e-4}}]
    product: {optim.lr: *adam_lrs}
  - base: *mnist_d8
    variants: [{optim: {name: adamw, weight_decay: 0.03}}, {optim: {name: adam_l2, weight_decay: 1.0e-4}}]
    product: {optim.lr: *adam_lrs}

  # ---- SGD family, every alpha level ----
  - base: *ts
    variants: *sgd_family
    product: {model.init_scale: [0.5, 1.0, 2.0], optim.lr: *sgd_lrs}
  - base: *mod_add
    variants: *sgd_family
    product: {model.init_scale: [1.0, 2.0, 4.0], optim.lr: *sgd_lrs}
  - base: *mod_mul
    variants: *sgd_family
    product: {model.init_scale: [1.0, 2.0, 4.0], optim.lr: *sgd_lrs}
  - base: *mod_quad
    variants: *sgd_family
    product: {model.init_scale: [1.0, 2.0, 4.0], optim.lr: *sgd_lrs}
  - base: *mnist_d3
    variants: *sgd_family
    product: {model.init_scale: [1.0, 2.0, 4.0], optim.lr: *sgd_lrs}
  - base: *mnist_d8
    variants: *sgd_family
    product: {model.init_scale: [1.0, 2.0, 4.0], optim.lr: *sgd_lrs}

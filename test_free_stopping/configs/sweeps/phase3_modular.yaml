  - base: *mod_mul
    variants: [{model.init_scale: 4.0, optim: {name: adam_l2, lr: 1.0e-3}}]
    product: {optim.weight_decay: [0.0, 1.0e-6, 1.0e-4, 1.0e-3], seed: [0, 1, 2, 3]}
  - base: *mod_mul
    variants: [{model.init_scale: 1.0, optim: {name: sgd, lr: 1.0}}]
    product: {optim.weight_decay: [0.0, 1.0e-4, 3.0e-4, 1.0e-3], seed: [0, 1, 2, 3]}
  - base: *mod_mul
    variants: [{model.init_scale: 4.0, optim: {name: sgd, lr: 1.0}}]
    product: {optim.weight_decay: [0.0, 1.0e-4, 3.0e-4, 1.0e-3], seed: [0, 1, 2, 3]}
  - base: *mod_mul
    variants: [{model.init_scale: 1.0, optim: {name: sgd_momentum, lr: 0.3, momentum: 0.9}}]
    product: {optim.weight_decay: [0.0, 3.0e-5, 1.0e-4, 3.0e-4], seed: [0, 1, 2, 3]}
  - base: *mod_mul
    variants: [{model.init_scale: 4.0, optim: {name: sgd_momentum, lr: 0.3, momentum: 0.9}}]
    product: {optim.weight_decay: [0.0, 3.0e-5, 1.0e-4, 3.0e-4], seed: [0, 1, 2, 3]}
  # ---- x/y (replaces x^2+xy+y^2, which never generalized), reduced: alpha {1, 4}, train fraction 0.5 ----
  - base: *mod_div
    variants: [{model.init_scale: 1.0, optim: {name: adamw, lr: 1.0e-3}}]

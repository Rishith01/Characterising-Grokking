# Phase 1 gate G1-det (PLAN.md §6): one config per application x every optimizer.
# 20k steps with keyframes every 10k, so replay crosses two full keyframe intervals (the
# worst-case drift distance). det_check's --steps / --keyframe-every override these for
# the shorter CPU pass.
#
# MNIST SGD runs use init scale 1: at alpha = 8 the network's outputs are so large that
# SGD diverged on the first step in Phase 1, so its determinism was never exercised.
# (Finding a usable SGD learning rate at alpha = 8 is the job of phase1b_lr_scan.yaml.)
optimizers: &optimizers
  - {name: adamw, lr: 1.0e-3, weight_decay: 0.01}
  - {name: adam_l2, lr: 1.0e-3, weight_decay: 1.0e-4}
  - {name: sgd_momentum, lr: 1.0e-2, weight_decay: 1.0e-4, momentum: 0.9}
  - {name: sgd, lr: 5.0e-2, weight_decay: 1.0e-4}
adam_only: &adam_only
  - {name: adamw, lr: 1.0e-3, weight_decay: 0.01}
  - {name: adam_l2, lr: 1.0e-3, weight_decay: 1.0e-4}
sgd_only: &sgd_only
  - {name: sgd_momentum, lr: 1.0e-2, weight_decay: 1.0e-4, momentum: 0.9}
  - {name: sgd, lr: 5.0e-2, weight_decay: 1.0e-4}

mnist_d3: &mnist_d3
  task: {name: mnist, params: {n_train: 1000}}
  model: {depth: 3, width: 200, activation: relu, init_scale: 8.0}
  optim: {name: adamw, lr: 1.0e-3, weight_decay: 0.01}
  loss: mse
  steps: 20000
  seed: 0
  batch_size: 200
mnist_d8: &mnist_d8
  task: {name: mnist, params: {n_train: 2000}}
  model: {depth: 8, width: 400, activation: relu, init_scale: 8.0}
  optim: {name: adamw, lr: 1.0e-3, weight_decay: 0.01}
  loss: mse
  steps: 20000
  seed: 0
  batch_size: 200

blocks:
  - base:
      task: {name: teacher_student, params: {n_train: 100, n_test: 100}}
      model: {depth: 3, width: 100, activation: tanh, init_scale: 2.0}
      optim: {name: adamw, lr: 3.0e-4, weight_decay: 0.03}
      loss: mse
      steps: 20000
      seed: 0
    product: {optim: *optimizers}

  - base:
      task: {name: modular, params: {op: x+y, p: 97, train_frac: 0.3}}
      model: {depth: 3, width: 512, activation: relu, init_scale: 1.0}
      optim: {name: adamw, lr: 1.0e-3, weight_decay: 1.0}
      loss: ce
      steps: 20000
      seed: 0
    product: {optim: *optimizers}

  - base: *mnist_d3
    product: {optim: *adam_only}
  - base: *mnist_d3
    variants: [{model.init_scale: 1.0}]
    product: {optim: *sgd_only}

  - base: *mnist_d8
    product: {optim: *adam_only}
  - base: *mnist_d8
    variants: [{model.init_scale: 1.0}]
    product: {optim: *sgd_only}

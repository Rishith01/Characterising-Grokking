# Canonical NN reproduction -- literal project.md Appendix B spec (weight_decay=1.0).
# See agopx/learners/neural.py's module docstring for the full weight-decay
# investigation: circulant deviation doesn't converge cleanly for the NN at any
# weight decay or epoch count tried, so it's treated as an RFM-only check; the
# paper's own actual NN check (no-diag NFM-vs-sqrt(AGOP) correlation) passes at this
# literal spec given enough epochs. nn_x_plus_y_p61_wd0.1.yaml and
# nn_x_plus_y_p61_wd1.0_long.yaml remain as diagnostic runs from that investigation.
learner: nn
run_id: nn_x_plus_y_p61_r0.5_seed0

operation: "x+y"
p: 61
training_fraction: 0.5
width: 1024
epochs: 50
batch_size: 32
lr: 0.001
weight_decay: 1.0
snapshot_every: 1
seed: 0
